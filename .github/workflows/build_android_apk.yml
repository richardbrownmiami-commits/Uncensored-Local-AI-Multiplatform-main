name: Build Android APK (armeabi-v7a)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          android-version: 35
          build-tools-version: 35.0.0
          ndk-version: 28.0.12674087
          cmake-version: 3.31.0
          accept-licenses: yes

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Flutter Doctor
        run: flutter doctor

      - name: Get Dependencies
        run: flutter pub get

      - name: Verify ARMv7 Android target
        run: flutter build apk --target-platform android-arm --debug --no-shrink

      - name: Build APK for armeabi-v7a (32-bit)
        run: flutter build apk --target-platform android-arm --release

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Uncensored-Local-AI-v2.0.0-armeabi-v7a-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Uncensored-Local-AI-armeabi-v7a
          path: build/app/outputs/flutter-apk/Uncensored-Local-AI-v2.0.0-armeabi-v7a-release.apk
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          name: Uncensored Local AI v2.0.0 (armeabi-v7a)
          tag_name: v2.0.0-armeabi-v7a
          files: build/app/outputs/flutter-apk/Uncensored-Local-AI-v2.0.0-armeabi-v7a-release.apk
          body: |
            Android 32-bit (armeabi-v7a) build of Uncensored Local AI.

            ARMv7 uses the fcllama/llama.cpp native backend with CPU-only
            inference, small context defaults, and app-private GGUF storage.

            **Features:**
            - Zero Censorship AI
            - Fully Offline
            - Local OpenAI API Server
            - Model Library
            - Chat History

            **Architecture:** armeabi-v7a (32-bit ARM)
            **Minimum Android:** API 23 (Android 6), Android 10+ recommended
            **Target:** Older/budget Android phones

            **Note:** 32-bit ARM devices have limited address space. Small
            GGUF models (including ~200 MB models) are the intended baseline;
            model size is not a guarantee of successful loading on a 1 GB device.
