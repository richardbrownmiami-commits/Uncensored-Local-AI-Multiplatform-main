name: portable_ai_flutter
description: "Portable AI — Run uncensored local LLMs natively on any device."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.10.7 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Cross-platform desktop/iOS engine. Android uses the native SmolChat-style
  # llama.cpp/JNI engine in android/app/src/main/cpp.
  llamadart: ^0.6.13

  # ── State Management ────────────────────────────────────────────
  get: ^4.7.2

  # ── Local Storage ───────────────────────────────────────────────
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # ── Networking / Downloads ──────────────────────────────────────
  http: ^1.2.2

  # ── Secure Credential Storage ─────────────────────────────────────
  flutter_secure_storage: ^9.2.2

  # ── File System ──────────────────────────────────────────────────
  path_provider: ^2.1.5
  path: ^1.9.1
  file_picker: ^8.1.7

  # ── Tools & Utilities ────────────────────────────────────────────
  device_info_plus: ^10.1.0

  # ── UI Helpers ────────────────────────────────────────────────────
  flutter_markdown: ^0.7.6
  google_fonts: ^6.2.1
  percent_indicator: ^4.2.4
  flutter_animate: ^4.5.0
  cupertino_icons: ^1.0.8

  # ── Background / Wake Lock ───────────────────────────────────────
  wakelock_plus: ^1.2.10
  flutter_foreground_task: ^9.2.2
  disable_battery_optimization: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models_catalog.json
